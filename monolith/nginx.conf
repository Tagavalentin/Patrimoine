# Configuration nginx monolithe — __PORT__ est remplacé par $PORT au démarrage.
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    upstream frontend { server 127.0.0.1:8000; }
    upstream auth { server 127.0.0.1:8001; }
    upstream asset { server 127.0.0.1:8002; }
    upstream maintenance { server 127.0.0.1:8003; }
    upstream inventory { server 127.0.0.1:8004; }
    upstream reporting { server 127.0.0.1:8005; }

    server {
        listen __PORT__;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /api/auth/ {
            rewrite ^/api/auth/(.*)$ /api/$1 break;
            proxy_pass http://auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/assets/ {
            rewrite ^/api/assets/(.*)$ /api/$1 break;
            proxy_pass http://asset;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/maintenance/ {
            rewrite ^/api/maintenance/(.*)$ /api/$1 break;
            proxy_pass http://maintenance;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/inventory/ {
            rewrite ^/api/inventory/(.*)$ /api/$1 break;
            proxy_pass http://inventory;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/reports/ {
            rewrite ^/api/reports/(.*)$ /api/$1 break;
            proxy_pass http://reporting;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Frontend Laravel (Blade + Livewire) — tout le reste
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
