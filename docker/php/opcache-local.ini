; Override local au Dockerfile (chargé en dernier : préfixe zz-).
; Les bind mounts Windows/OneDrive rendent chaque stat() très lent :
; avec validate_timestamps=1 + revalidate_freq=0, OPcache revalide
; des milliers de fichiers à chaque requête (> 2 min par hit).
; Désactivé ici : après modification du code PHP, recharger php-fpm
; (docker compose restart <service> ou kill -USR2 1 dans le conteneur).
opcache.validate_timestamps=0
