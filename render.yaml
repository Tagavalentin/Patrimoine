# Blueprint Render — « Gestion du Patrimoine de l'État »
# Déploiement : Render Dashboard → New → Blueprint → coller ce fichier
# (ou `render blueprint launch` avec la CLI).
#
# Architecture : 7 web services Docker + 1 PostgreSQL managé.
# Les secrets (APP_KEY, JWT_SECRET, mots de passe DB, URLs croisées)
# sont marqués sync:false → à renseigner dans le dashboard après le
# premier déploiement.
#
# ATTENTION aux limites du plan gratuit : les web services se
# mettent en veille après inactivité et le Postgres gratuit expire.

services:
  # ---------------- Auth ----------------
  - type: web
    name: auth-service
    runtime: docker
    repo: https://github.com/Tagavalentin/Patrimoine
    branch: main
    dockerfilePath: services/auth-service/Dockerfile
    dockerContext: services/auth-service
    healthCheckPath: /api/health
    dockerCommand: 'php artisan package:discover && php artisan migrate --force && if [ "$SEED_ON_BOOT" = "1" ]; then php artisan db:seed --force; fi && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
    envVars:
      - key: APP_NAME
        value: "Auth Service"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:vDBHlxBry8Q1GvZJaBXJi7bnaE0rf65mZ6oasoD+I/Y="
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: patrimoine-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: patrimoine-db, property: port }
      - key: DB_DATABASE
        value: auth_db
      - key: DB_USERNAME
        fromDatabase: { name: patrimoine-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: patrimoine-db, property: password }
      - key: JWT_SECRET
        value: "2a57af8710d0003e85ea7dcc73ef1bb41ef068a8f6a08134644493c51f88b0b9d6507384b0399eb6d1697d8cd5af7ddfb2192cccddbc776df9c151599517c057"
      - key: JWT_ISSUER
        value: patrimoine-auth-service
      - key: JWT_TTL
        value: "60"
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SEED_ON_BOOT
        value: "1"
      - key: SEED_USER_PASSWORD
        value: "password"

